[project]
name = "customer-twin"
version = "0.1.0"
description = "Customer Digital Twin MVP for Insurise — churn risk, simulation, and recommendations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<0.116",
    "uvicorn[standard]>=0.29,<0.31",
    "pydantic>=2.6,<3",
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.1",
    "scikit-learn>=1.4,<1.6",
    "joblib>=1.3,<1.5",
]

[tool.uv]
package = false
